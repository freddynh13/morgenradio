# ============================================================================
# MORGENRADIO — konfiguration
# ============================================================================
# Det er den eneste fil, du skal rette i til daglig. Alle nøgler (API-keys)
# ligger som GitHub Secrets og står ALDRIG her.
# ============================================================================

station:
  navn: "Morgenradio"                 # siges i intro/outro og vises i afspilleren
  slogan: "Frederiks personlige morgen"
  by: "Aarhus"                        # til vejret
  breddegrad: 56.1567
  laengdegrad: 10.2108
  tidszone: "Europe/Copenhagen"

# Hvem radioen er til. Værterne bruger det til at gøre udsendelsen personlig.
lytter:
  navn: "Frederik"
  bor: "Aarhus"
  arbejde: "digital marketing på et bureau (SEO, Google Ads, paid social, e-mail og AI i marketing)"
  om_mig: >
    Følger med i fodboldlandsholdet og international fodbold. Kan lide en blanding
    af dansk og international musik. Interesseret i tech, AI, økonomi og bolig.

# To værter giver radiofølelse.
# OpenAI-stemmer der fungerer godt på dansk: marin, cedar, coral, ash, sage, ballad, verse.
# elevenlabs_voice_id bruges kun hvis tts.udbyder er "elevenlabs" (se nedenfor).
vaerter:
  - navn: "Sofie"
    stemme: "marin"
    elevenlabs_voice_id: ""
    personlighed: "varm, kvik og nysgerrig. Styrer showet, laver overgangene og stiller de gode opfølgende spørgsmål."
    stemme_stil: "Kvindelig stemme, midt i 30'erne, lys og smilende, taler lidt hurtigt når hun er engageret."
  - navn: "Mads"
    stemme: "cedar"
    elevenlabs_voice_id: ""
    personlighed: "tør humor, fodboldnørd og musikelsker. Lidt drillende, men aldrig fjollet ved alvorlige nyheder."
    stemme_stil: "Mandlig stemme, sidst i 30'erne, dyb og afslappet, med et lille grin i stemmen ved sjove ting."

# Fælles stilinstruktion til stemmerne.
stemme_instruktion: >
  Du er vært på et dansk morgenradioprogram og taler med din medvært. Tal naturligt,
  ubesværet rigsdansk med dansk udtale og danske tryk — aldrig med engelsk eller svensk
  accent. Udtal danske navne, stednavne og tal korrekt. Lyd vågen og nærværende, som en
  rigtig vært i et studie klokken syv om morgenen.

# Stemme-udbyder.
#   openai     — billig (ca. 1 kr. pr. udsendelse), god kvalitet. Kræver OPENAI_API_KEY.
#   elevenlabs — den mest naturlige danske tale (eleven_v3), ca. 5-10 kr. pr. udsendelse.
#                Kræver GitHub Secret ELEVENLABS_API_KEY og elevenlabs_voice_id på værterne.
tts:
  udbyder: "openai"
  elevenlabs_model: "eleven_v3"

# Blød musikbund under intro og outro (radiofølelse). false = slå fra.
musikbund: true

# Udsendelsens opbygning. Rækkefølgen er rækkefølgen i radioen.
# type: tale = værterne taler, sang = et nummer fra Spotify.
# antal = hvor mange historier segmentet højst må bruge.
programflade:
  - { id: intro,    type: tale, titel: "God morgen + vejret" }
  - { id: nyheder,  type: tale, titel: "Nyhederne",        kategori: nyheder, antal: 5 }
  - { id: sang1,    type: sang }
  - { id: aarhus,   type: tale, titel: "Nyt fra Aarhus",   kategori: lokalt,  antal: 2 }
  - { id: sport,    type: tale, titel: "Sporten",          kategori: sport,   antal: 4 }
  - { id: sang2,    type: sang }
  - { id: musik,    type: tale, titel: "Musiknyt",         kategori: musik,   antal: 3 }
  - { id: sang3,    type: sang, gerne_koblet_til: musik }   # fx et nummer af en kunstner fra musiknyt
  - { id: let,      type: tale, titel: "Dagens lette historie", kategori: nyheder, antal: 1 }
  - { id: outro,    type: tale, titel: "Tak for i dag" }
  - { id: sang4,    type: sang }

# Hvor lang værternes tale samlet må være (sange kommer oveni).
tale_minutter: 10

# Hvad du interesserer dig for — bruges både til at vælge historier og sange.
interesser:
  sport_fokus: ["Fodboldlandsholdet", "Danske spillere i udlandet", "Champions League", "Premier League", "La Liga", "Store transfers"]
  nyheder_fokus: ["De store danske historier", "Verden og politik", "Tech og AI", "Digital marketing (Google, Meta, TikTok, AI-søgning)", "Økonomi, renter og bolig", "Aarhus og Østjylland"]
  undgaa_emner: []                    # fx ["kongehuset", "reality"] — ord der filtreres helt fra

musik:
  smag: >
    Bred og glad morgenmix: dansk pop og indie (fx Tobias Rahim, Gilli, Medina, Mø,
    Ukendt Kunstner, Lukas Graham, Hjalmer), internationale hits fra lige nu, kendte
    00'er- og 10'er-klassikere og hiphop/R&B (dansk og internationalt, fx Drake,
    The Weeknd, SZA, Kendrick Lamar, Rhymes). Gerne kendte numre med energi om morgenen.
    Ikke hård metal og ikke for melankolsk.
  andel_danske: 0.5                   # cirka hvor stor del der må være danske numre
  undgaa_gentagelse_dage: 30          # samme sang spilles tidligst igen efter så mange dage
  # Bruges hvis Claude foreslår noget Spotify ikke kan finde. "Kunstner - Titel".
  reservesange:
    - "Medina - Kun for mig"
    - "Lukas Graham - 7 Years"
    - "Mø - Final Song"
    - "Tobias Rahim - Stor Mand"
    - "Dua Lipa - Levitating"
    - "Pharrell Williams - Happy"
    - "Phoenix - 1901"
    - "Outkast - Hey Ya!"
    - "The Weeknd - Blinding Lights"
    - "Gilli - Tidligere"

# AI-modeller
claude:
  model: "claude-opus-5"              # samme som dit nyhedsbrev. Billigere: "claude-sonnet-4-5"
  max_tokens: 16000
openai_tts:
  model: "gpt-4o-mini-tts"            # du kan prøve nyere versioner her, når OpenAI udgiver dem
  reserve_stemmer: ["coral", "ash"]   # bruges hvis en valgt stemme ikke virker

# Kilder. weight: 3 = foretrukken kilde (bedste link/fakta), 1 = aggregator.
# fulltekst: true = hent artiklens tekst, så værterne har flere fakta (virker
# ikke på Google News-links, de er omdirigeringer).
kilder:
  nyheder:
    - { navn: "DR Nyheder",       url: "https://www.dr.dk/nyheder/service/feeds/senestenyt", weight: 3, fulltekst: true }
    - { navn: "DR Indland",       url: "https://www.dr.dk/nyheder/service/feeds/indland",    weight: 3, fulltekst: true }
    - { navn: "DR Udland",        url: "https://www.dr.dk/nyheder/service/feeds/udland",     weight: 3, fulltekst: true }
    - { navn: "TV 2 Nyheder",     url: "https://feeds.tv2.dk/nyheder/rss",                   weight: 3, fulltekst: true }
    - { navn: "Politiken",        url: "https://politiken.dk/rss/senestenyt.rss",            weight: 2, fulltekst: false }
    - { navn: "Google News DK",   url: "https://news.google.com/rss?hl=da&gl=DK&ceid=DK:da",  weight: 1, fulltekst: false }
    - { navn: "Google News Tech", url: "https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }
    - { navn: "Google News Økonomi", url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }
    - { navn: "Google News AI & marketing", url: "https://news.google.com/rss/search?q=(%22kunstig%20intelligens%22%20OR%20ChatGPT%20OR%20OpenAI%20OR%20%22Google%20Ads%22%20OR%20%22Meta%20ads%22%20OR%20TikTok)%20when%3A1d&hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }
  lokalt:
    - { navn: "Google News Aarhus", url: "https://news.google.com/rss/search?q=Aarhus%20when%3A1d&hl=da&gl=DK&ceid=DK:da", weight: 2, fulltekst: false }
    - { navn: "Google News Østjylland", url: "https://news.google.com/rss/search?q=(%C3%98stjylland%20OR%20Aarhus%20Kommune%20OR%20Aarhus%20Universitet)%20when%3A2d&hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }
  sport:
    - { navn: "DR Sporten",       url: "https://www.dr.dk/nyheder/service/feeds/sporten",    weight: 3, fulltekst: true }
    - { navn: "TV 2 Sport",       url: "https://feeds.tv2.dk/sport/rss",                     weight: 3, fulltekst: true }
    - { navn: "Bold.dk",          url: "https://www.bold.dk/feed/rss",                       weight: 2, fulltekst: false }
    - { navn: "Google News Fodbold", url: "https://news.google.com/rss/search?q=(landsholdet%20OR%20%22Champions%20League%22%20OR%20%22Premier%20League%22)%20fodbold%20when%3A1d&hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }
    - { navn: "Google News Sport",url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }
  musik:
    - { navn: "GAFFA",            url: "https://gaffa.dk/feed/",                             weight: 3, fulltekst: true }
    - { navn: "Soundvenue",       url: "https://soundvenue.com/feed",                        weight: 3, fulltekst: true }
    - { navn: "Pitchfork News",   url: "https://pitchfork.com/feed/feed-news/rss",           weight: 2, fulltekst: false }
    - { navn: "NME",              url: "https://www.nme.com/news/music/feed",                weight: 2, fulltekst: false }
    - { navn: "Google News Musik",url: "https://news.google.com/rss/search?q=musik%20OR%20album%20OR%20koncert%20when%3A2d&hl=da&gl=DK&ceid=DK:da", weight: 1, fulltekst: false }

indsamling:
  timer_tilbage: 26                   # kun nyheder fra det sidste døgn (+ lidt margen)
  max_pr_kilde: 40
  max_kandidater_pr_kategori: 35      # hvor mange klynger Claude får at vælge imellem
  fulltekst_tegn: 1800                # hvor meget artikeltekst værterne får pr. historie

arkiv:
  behold_dage: 10                     # ældre udsendelser slettes fra siden
